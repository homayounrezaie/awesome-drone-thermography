# Taxonomy for drone thermography papers.
#
# Every pattern is a case-insensitive Python regular expression, matched at
# word boundaries against title + abstract + keywords. A paper can get several
# tags. Edit this file and run `python tools/retag.py` to re-tag without
# hitting the API again.

# ---------------------------------------------------------------------------
# Relevance filter: a paper is kept only if it matches at least one platform
# pattern AND at least one thermal pattern.
# ---------------------------------------------------------------------------
relevance:
  platform:
    - UAVs?
    - UASs?
    - sUAS
    - drones?
    - unmanned aerial
    - unmanned aircraft
    - RPAS
    - remotely piloted
    - quadcopters?
    - quadrotors?
    - multicopters?
    - multi-?rotors?
    - hexacopters?
    - octocopters?
    - fixed-wing UAV
  thermal:
    - thermal infrared
    - thermograph\w*
    - thermal (?:imag\w*|camera\w*|sensor\w*|data|band\w*|map\w*|orthomosaic\w*|survey\w*|remote sensing|signature\w*|anomal\w*|images?)
    - TIR
    - LWIR
    - MWIR
    - long-?wave infrared
    - infrared (?:camera\w*|imag\w*|thermograph\w*|sensor\w*)
    - IR (?:camera\w*|imag\w*)
    - land surface temperatures?
    - LST
    - canopy temperatures?
    - surface temperatures?
    - leaf temperatures?
    - crop water stress
    - CWSI
    - radiometric(?:ally)? (?:calibrat\w*|thermal|temperature)
    - thermal (?:\w+ )?(?:imag\w*|camera\w*|sensor\w*|orthomosaic\w*|infrared)
    - (?:UAV|drone|aerial)[- ]thermal
    - thermal (?:UAV|drone|aerial)
    - (?:RGB|visible)\s?[-–—]\s?(?:thermal|T|TIR|infrared)
    - thermal (?:properties|patterns?|regimes?|maps?|mapping|mosaics?|signatures?|anomal\w*|hotspots?|contrast)
    - (?:thermal|infrared) (?:videos?|footage|frames?|modality)
    - temperature (?:maps?|mapping|images?)
    - (?:RGB|visible|multispectral)(?:,| and| &) thermal
    - thermal (?:and|&) (?:RGB|visible|multispectral)
  # Papers that only match these get relevance "weak" (kept, but flagged for triage)...
  thermal_weak:
    - thermal
  # ...and are dropped if they also match one of these.
  exclude_if_weak:
    - fuel cells?
    - engines?
    - thermal analysis
    - hybrid (?:electric|power)
    - thermal fog
    - propulsion
    - thermal (?:management|runaway|soaring|updrafts?|stability|conductivity|load|model of the battery)
    - thermals
    - battery thermal
    - heat dissipation

