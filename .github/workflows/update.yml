name: Weekly update

on:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC
  workflow_dispatch:
  push:
    paths: ["data/papers.csv", "taxonomy.yaml", "templates/**", "tools/**"]

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: pytest -q
      - name: Fetch all papers from OpenAlex (new papers + updated citation counts)
        if: github.event_name != 'push'
        run: python tools/fetch_openalex.py --query core
      - name: Fetch full-text tier (needs the OPENALEX_API_KEY secret; ~180 requests)
        if: github.event_name != 'push' && env.OPENALEX_API_KEY != ''
        run: python tools/fetch_openalex.py --query fulltext
      - run: python tools/build_readme.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md REVIEW_QUEUE.md categories data/papers.csv
          git diff --cached --quiet && exit 0
          git commit -m "Update paper list ($(date +%F))"
          git pull --rebase   # someone may have pushed while this job ran
          git push
