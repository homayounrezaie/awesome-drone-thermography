name: Collect papers

on:
  schedule:
    - cron: "0 6 * * *"   # daily 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: pytest -q
      - name: Core search (Mondays) - new papers + updated citation counts
        run: |
          if [ "$(date -u +%u)" = 1 ]; then python tools/fetch_openalex.py --query core; fi
      - name: Full-text search (daily; resumes where the last run stopped)
        run: python tools/fetch_openalex.py --query fulltext
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/papers.csv data/fetch_state.json
          git diff --cached --quiet && exit 0
          git commit -m "Collect papers ($(date -u +%F))"
          git pull --rebase   # someone may have pushed while this job ran
          git push
