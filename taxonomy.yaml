# ---------------------------------------------------------------------------
# Cross-cutting method tags (HOW the work is done). Shown as a column.
# ---------------------------------------------------------------------------
methods:
  - slug: deep-learning
    name: Deep learning
    patterns:
      - deep learning
      - neural networks?
      - CNNs?
      - convolutional
      - YOLO\w*
      - U-?Net
      - vision transformers?
      - transformer-based
      - Swin
      - Faster R-CNN
      - Mask R-CNN
      - semantic segmentation
      - instance segmentation
  - slug: machine-learning
    name: Machine learning
    patterns:
      - machine learning
      - random forests?
      - support vector
      - SVM
      - XGBoost
      - gradient boosting
  - slug: calibration
    name: Radiometric calibration
    patterns:
      - radiometric(?:ally)? calibrat\w*
      - (?:temperature|thermal) calibrat\w*
      - emissivity
      - atmospheric correction
      - vignetting
      - non-uniformity
      - NUC
      - temperature drift
      - blackbody
      - accuracy assessment
  - slug: 3d-photogrammetry
    name: 3D / photogrammetry
    patterns:
      - photogrammetr\w*
      - structure from motion
      - SfM
      - point clouds?
      - 3D (?:thermal|model\w*|reconstruction|mapping)
      - orthomosaic\w*
      - digital surface model
      - DSM
      - LiDAR
  - slug: multisensor-fusion
    name: Multi-sensor fusion
    patterns:
      - (?:image|data|sensor) fusion
      - multispectral
      - hyperspectral
      - RGB and thermal
      - RGB-?T
      - visible and (?:thermal|infrared)
      - LiDAR
  - slug: dataset
    name: Dataset / benchmark
    patterns:
      - (?:new|public|open|publicly available|benchmark|annotated|large-scale) datasets?
      - benchmark\w*
      - we (?:release|present|introduce) (?:a |the )?\w*\s?dataset
  - slug: review
    name: Review / survey
    fields: title          # only matched against the title (plus OpenAlex type 'review')
    patterns:
      - (?:systematic |literature |state-of-the-art |comprehensive |critical )?review
      - survey of
      - meta-analysis
      - bibliometric

# ---------------------------------------------------------------------------
# Thermal sensors / cameras commonly flown on drones (for the "sensor" column).
# Key = display name, value = pattern.
# ---------------------------------------------------------------------------
sensors:
  FLIR Vue Pro: FLIR Vue\s?Pro\w*
  FLIR Duo: FLIR Duo\w*
  FLIR Tau 2: Tau\s?2|Tau\s?640
  FLIR Boson: Boson
  FLIR Lepton: Lepton
  FLIR A-series: FLIR A\d{2,3}\w*
  DJI Zenmuse XT: Zenmuse XT(?!2|S)|DJI XT(?!2)
  DJI Zenmuse XT2: Zenmuse XT2|DJI XT2
  DJI Zenmuse H20T/N: H20[TN]
  DJI Zenmuse H30T: H30T
  DJI Mavic 2 Enterprise Advanced: Mavic 2 Enterprise|M2EA
  DJI Mavic 3 Thermal: Mavic 3 (?:Thermal|T\b)|M3T
  DJI Matrice 30T: M30T|Matrice 30T
  DJI Zenmuse XT/XT2 (unspecified): Zenmuse
  Workswell WIRIS: WIRIS|Workswell
  Optris: Optris
  ICI: ICI \d{4}|Infrared Cameras Inc
  senseFly thermoMAP: thermoMAP|Duet T
  MicaSense Altum: Altum
  Teax ThermalCapture: ThermalCapture|TeAx
  Jenoptik VarioCAM: VarioCAM
  InfraTec: InfraTec
  Parrot Anafi Thermal: Anafi (?:Thermal|USA)
